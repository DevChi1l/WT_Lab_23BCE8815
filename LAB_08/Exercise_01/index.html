<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --card: white;
      --text: #1e293b;
      --muted: #64748b;
      --success: #10b981;
      --shadow: 0 10px 30px rgba(99, 102, 241, 0.12);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .calculator {
      background: var(--card);
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
      padding: 2.5rem 2.2rem;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--primary-dark);
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.3rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 0.8rem;
      border: 1px solid #e2e8f0;
      font-size: 1.05rem;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    button {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border: none;
      border-radius: 0.9rem;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    #result {
      margin-top: 2rem;
      padding: 1.4rem;
      border-radius: 1rem;
      background: #f0f4ff;
      font-size: 1.15rem;
      line-height: 1.6;
      min-height: 6rem;
      white-space: pre-line;
    }

    .highlight {
      font-weight: 700;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h1>Student Marks Calculator</h1>

    <div class="form-group">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="e.g. Arun" value="Arun">
    </div>

    <div class="form-group">
      <label for="mark1">Mark 1</label>
      <input type="number" id="mark1" min="0" max="100" placeholder="e.g. 85" value="85">
    </div>

    <div class="form-group">
      <label for="mark2">Mark 2</label>
      <input type="number" id="mark2" min="0" max="100" placeholder="e.g. 90" value="90">
    </div>

    <div class="form-group">
      <label for="mark3">Mark 3</label>
      <input type="number" id="mark3" min="0" max="100" placeholder="e.g. 88" value="88">
    </div>

    <button id="calculateBtn">Calculate Total & Average</button>

    <div id="result">Enter marks and click the button above</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
