<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        
        <div class="form-container">
            <h2>Add / Update Student</h2>
            <form id="studentForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <input type="text" id="studentId" placeholder="Student ID" required>
                </div>
                
                <div class="form-group">
                    <input type="text" id="studentName" placeholder="Full Name" required>
                </div>
                
                <div class="form-group">
                    <input type="text" id="department" placeholder="Department" required>
                </div>
                
                <div class="form-group">
                    <input type="number" id="marks" placeholder="Marks" min="0" max="100" required>
                </div>
                
                <div class="button-group">
                    <button type="submit" id="submitBtn">Add Student</button>
                    <button type="button" id="cancelEdit">Cancel</button>
                </div>
            </form>
        </div>
        
        <div id="message"></div>
        
        <div class="table-container">
            <h2>Students List</h2>
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="5" class="loading">Loading students...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
