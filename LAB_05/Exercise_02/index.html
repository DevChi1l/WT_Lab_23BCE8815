<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Library Book Tracker</h2>
        
        <div>
            <h3>Add New Book</h3>
            <form id="bookForm">
                <input type="text" id="bookId" placeholder="Book ID" required>
                <input type="text" id="bookTitle" placeholder="Title" required>
                <input type="text" id="bookAuthor" placeholder="Author" required>
                <select id="bookStatus" required>
                    <option value="">Status</option>
                    <option value="Available">Available</option>
                    <option value="Checked Out">Checked Out</option>
                </select>
                <button type="submit">Add Book</button>
            </form>
        </div>
        
        <div id="message"></div>
        
        <div>
            <h3>Books List</h3>
            <table border="1" id="booksTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="booksTableBody">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
