<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .products { flex: 2; }
        .cart { flex: 1; background: #f5f5f5; padding: 15px; }
        .product { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
        button { padding: 5px 10px; margin: 0 5px; }
        .cart-item { margin: 5px 0; padding: 5px; background: white; }
        .discounts { background: #e8f4fc; padding: 10px; margin: 10px 0; }
        .error { color: red; font-size: 0.9em; }
        .success { color: green; }
        h3 { margin-top: 0; }
        #total { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <h2>Intelligent Shopping Cart</h2>
    <p>Dynamic discounts based on quantity, category & time</p>
    
    <div class="container">
        <div class="products">
            <h3>Available Products</h3>
            <div id="productsList"></div>
            
            <div class="discounts">
                <h3>Active Discounts</h3>
                <div id="activeDiscounts"></div>
            </div>
            
            <div>
                <h3>Apply Coupon</h3>
                <input type="text" id="couponCode" placeholder="Enter coupon code">
                <button onclick="applyCoupon()">Apply</button>
                <div id="couponMessage"></div>
            </div>
        </div>
        
        <div class="cart">
            <h3>Your Cart</h3>
            <div id="cartItems"></div>
            <div id="cartSummary"></div>
        </div>
    </div>

    <script>
            const products = [
            { id: 1, name: "Laptop", price: 999, category: "electronics", quantity: 0 },
            { id: 2, name: "Mouse", price: 29, category: "electronics", quantity: 0 },
            { id: 3, name: "T-Shirt", price: 25, category: "clothing", quantity: 0 },
            { id: 4, name: "Jeans", price: 59, category: "clothing", quantity: 0 },
            { id: 5, name: "Book", price: 15, category: "books", quantity: 0 },
            { id: 6, name: "Coffee", price: 5, category: "food", quantity: 0 },
            { id: 7, name: "Headphones", price: 129, category: "electronics", quantity: 0 },
            { id: 8, name: "Shoes", price: 89, category: "clothing", quantity: 0 }
        ];

        let cart = [];
        let activeDiscounts = [];
        let couponApplied = false;

        const discountRules = {
            bulk: { threshold: 100, discount: 0.10 }, // 10% off over $100
            electronics: { minItems: 2, discount: 0.15 }, // 15% off electronics if 2+ items
            clothing: { minItems: 3, discount: 0.20 }, // 20% off clothing if 3+ items
            morning: { startHour: 6, endHour: 12, discount: 0.05 }, // 5% morning discount
            coupon: { code: "SAVE10", discount: 0.10 } // 10% coupon
        };

        function init() {
            renderProducts();
            updateCartDisplay();
            updateDiscounts();
        }

        function renderProducts() {
            const container = document.getElementById('productsList');
            container.innerHTML = '';
            
            products.forEach(product => {
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
                    <strong>${product.name}</strong> ($${product.price}) 
                    <br>Category: ${product.category}
                    <button onclick="addToCart(${product.id})">Add</button>
                    <button onclick="removeFromCart(${product.id})">Remove</button>
                    Quantity: <span id="qty${product.id}">${product.quantity}</span>
                `;
                container.appendChild(div);
            });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);
            
            if (cartItem) {
                cartItem.quantity++;
                product.quantity++;
            } else {
                cart.push({
                    id: productId,
                    name: product.name,
                    price: product.price,
                    category: product.category,
                    quantity: 1
                });
                product.quantity = 1;
            }
            
            updateCartDisplay();
            updateDiscounts();
        }

        function removeFromCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartIndex = cart.findIndex(item => item.id === productId);
            
            if (cartIndex > -1) {
                cart[cartIndex].quantity--;
                product.quantity--;
                
                if (cart[cartIndex].quantity === 0) {
                    cart.splice(cartIndex, 1);
                    product.quantity = 0;
                }
            }
            
            updateCartDisplay();
            updateDiscounts();
        }

        function calculateDiscounts() {
            activeDiscounts = [];
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            if (subtotal > discountRules.bulk.threshold) {
                activeDiscounts.push({
                    name: "Bulk Purchase",
                    amount: subtotal * discountRules.bulk.discount
                });
            }
            
            const electronicsCount = cart.filter(item => item.category === 'electronics')
                                        .reduce((sum, item) => sum + item.quantity, 0);
            const clothingCount = cart.filter(item => item.category === 'clothing')
                                        .reduce((sum, item) => sum + item.quantity, 0);
            
            if (electronicsCount >= discountRules.electronics.minItems) {
                const electronicsTotal = cart.filter(item => item.category === 'electronics')
                                            .reduce((sum, item) => sum + (item.price * item.quantity), 0);
                activeDiscounts.push({
                    name: "Electronics Bundle",
                    amount: electronicsTotal * discountRules.electronics.discount
                });
            }
            
            if (clothingCount >= discountRules.clothing.minItems) {
                const clothingTotal = cart.filter(item => item.category === 'clothing')
                                        .reduce((sum, item) => sum + (item.price * item.quantity), 0);
                activeDiscounts.push({
                    name: "Clothing Bundle",
                    amount: clothingTotal * discountRules.clothing.discount
                });
            }
            
            const now = new Date();
            const currentHour = now.getHours();
            if (currentHour >= discountRules.morning.startHour && 
                currentHour < discountRules.morning.endHour) {
                activeDiscounts.push({
                    name: "Morning Special",
                    amount: subtotal * discountRules.morning.discount
                });
            }
            
            if (couponApplied) {
                activeDiscounts.push({
                    name: "Coupon Discount",
                    amount: subtotal * discountRules.coupon.discount
                });
            }
        }

        function applyCoupon() {
            const codeInput = document.getElementById('couponCode');
            const messageDiv = document.getElementById('couponMessage');
            const code = codeInput.value.trim().toUpperCase();
            
            if (code.length < 5) {
                messageDiv.textContent = "Coupon code must be at least 5 characters";
                messageDiv.className = 'error';
                return;
            }
            
            if (!code.includes("SAVE")) {
                messageDiv.textContent = "Invalid coupon format";
                messageDiv.className = 'error';
                return;
            }
            
            if (code === discountRules.coupon.code) {
                couponApplied = true;
                messageDiv.textContent = "Coupon applied successfully!";
                messageDiv.className = 'success';
                updateCartDisplay();
                updateDiscounts();
            } else {
                messageDiv.textContent = "Invalid coupon code";
                messageDiv.className = 'error';
            }
        }

        function updateCartDisplay() {
            const itemsDiv = document.getElementById('cartItems');
            const summaryDiv = document.getElementById('cartSummary');
            
            if (cart.length === 0) {
                itemsDiv.innerHTML = '<p>Your cart is empty</p>';
                summaryDiv.innerHTML = '';
                return;
            }
            
            itemsDiv.innerHTML = '';
            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    ${item.name} x${item.quantity} = $${(item.price * item.quantity).toFixed(2)}
                `;
                itemsDiv.appendChild(div);
            });
            
            products.forEach(product => {
                const qtySpan = document.getElementById(`qty${product.id}`);
                if (qtySpan) qtySpan.textContent = product.quantity;
            });
            
            calculateDiscounts();
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalDiscount = activeDiscounts.reduce((sum, disc) => sum + disc.amount, 0);
            const total = subtotal - totalDiscount;
            
            summaryDiv.innerHTML = `
                <hr>
                <p>Subtotal: $${subtotal.toFixed(2)}</p>
                <p>Discounts: -$${totalDiscount.toFixed(2)}</p>
                <p id="total">Total: $${total.toFixed(2)}</p>
                <p>Items in cart: ${cart.reduce((sum, item) => sum + item.quantity, 0)}</p>
            `;
        }

        function updateDiscounts() {
            const discountsDiv = document.getElementById('activeDiscounts');
            
            if (activeDiscounts.length === 0) {
                discountsDiv.innerHTML = '<p>No active discounts</p>';
                return;
            }
            
            discountsDiv.innerHTML = '';
            activeDiscounts.forEach(discount => {
                const div = document.createElement('div');
                div.innerHTML = `✓ ${discount.name}: -$${discount.amount.toFixed(2)}`;
                discountsDiv.appendChild(div);
            });
        }



        init();
    </script>
</body>
</html>
