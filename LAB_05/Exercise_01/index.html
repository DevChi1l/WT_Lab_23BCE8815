<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management (XML)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Employee Management System</h1>
        
        <div class="form-container">
            <h2>Add / Update Employee</h2>
            <form id="employeeForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <input type="text" id="empId" placeholder="Employee ID" required>
                </div>
                
                <div class="form-group">
                    <input type="text" id="empName" placeholder="Full Name" required>
                </div>
                
                <div class="form-group">
                    <input type="text" id="empDept" placeholder="Department" required>
                </div>
                
                <div class="form-group">
                    <input type="number" id="empSalary" placeholder="Salary" min="0" required>
                </div>
                
                <div class="button-group">
                    <button type="submit" id="submitBtn">Add Employee</button>
                    <button type="button" id="cancelEdit">Cancel</button>
                </div>
            </form>
        </div>
        
        <div id="message"></div>
        
        <div class="table-container">
            <h2>Employees List</h2>
            <table id="employeesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <tr>
                        <td colspan="5" class="loading">Loading employees...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
